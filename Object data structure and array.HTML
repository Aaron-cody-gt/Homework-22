<!DOCTYPE html>
<html>
  <body>
    <h2>JavaScript Objects Data Structure and Array</h2>
    <script>
    var student = {
        name: 'Aaron',
        age: '13',
        Grade: '8',
        hobbies: 'Reading',
        fav_sport: 'Cricket'
    };
    var color = ["Yellow", "Blue", "Orange", "Green", "Red"];
    document.write("Student name is : " + student.name,
    "<br>","Student favorite sport is : "+student.fav_sport);
    document.write("<br>Before Popping the colors are: " + color.join("^"));
    document.write("<br>My favorite color is : " + color[2]);
    color.pop();
    document.write("<br>After Popping the colors are : " + color.join("*"));
    </script>
  </body>
</html>
